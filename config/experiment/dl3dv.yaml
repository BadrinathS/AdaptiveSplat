# @package _global_

defaults:
  - /dataset@_group_.dl3dv: dl3dv
  - override /model/encoder: anysplat
  - override /model/encoder/backbone: croco
  - override /loss: [mse, lpips, depth_consis] # ablate: opacity loss

wandb:
  name: benchmark_time_test_step_15000_prune_${test.global_prune_percent}_context_${dataset.dl3dv.view_sampler.num_context_views}
  project: texture_anysplat_dl3dv
  entity: texture_anysplat_dl3dv
  tags: [dl3dv, 448x448]
  
model:
  encoder:
    gs_params_head_type: dpt_gs
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    pretrained_weights: ''
    voxel_size: 0.002
    pred_pose: true
    anchor_feat_dim: 128
    gs_prune: false # ablate: opacity loss
    pred_head_type: depth
    freeze_backbone: false
    distill: true
    render_conf: false
    conf_threshold: 0.1
    freeze_module: patch_embed
    voxelize: false
    intermediate_layer_idx: [4, 11, 17, 23]

dataset:
  dl3dv:
    input_image_shape: [224, 224]
    view_sampler:
      name: interleaved
      num_context_views: 3
      skip: 1
    # Disable bounded-specific overrides if any
    view_sampler_dataset_specific_config: null
    avg_pose: false
    intr_augment: true
    normalize_by_pts3d: false
    rescale_to_1cube: false

optimizer:
  lr: 2e-4
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 2 # not used here
    
trainer:
  max_steps: 30000
  val_check_interval: 500
  num_nodes: 1
  accumulate_grad_batches: 1
  precision: "32"

checkpointing:
  load: null
  every_n_train_steps: 200
  save_weights_only: false
  save_top_k: 5
  
train:
  pose_loss_alpha: 1.0
  pose_loss_delta: 1.0
  cxt_depth_weight: 0.0
  weight_pose: 10.0
  weight_depth: 1.0
  weight_normal: 0.0

test:
  output_path: outputs/test
  global_prune_percent: 80

hydra:
  run:
    dir: output_new/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}

loss:
  mse:
    conf: false
  lpips:
    conf: false
  depth_consis:
    weight: 0.1
    loss_type: MSE


